name: Synthetic project
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  verify:
    name: Project gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check synthetic fixture
        run: >-
          node -e "const f=require('./ci-fixture.json');
          if(f.quality!==true) process.exitCode=1;"
